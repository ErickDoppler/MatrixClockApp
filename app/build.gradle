plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.matrixclock'
    compileSdk 34

    defaultConfig {
        applicationId "com.matrixclock"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "2.1"

    }

    // Two builds, because the bundled sherpa-onnx TTS engine is an arm64-only APK: carrying it
    // on a 32-bit device wastes 81 MB that could never be installed there.
    flavorDimensions 'abi'
    productFlavors {
        full {
            dimension 'abi'
            ndk { abiFilters 'arm64-v8a' }
        }
        legacy {
            dimension 'abi'
            versionNameSuffix '-legacy'
            ndk { abiFilters 'armeabi-v7a' }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        // The bundled engine is already a compressed archive; recompressing it only costs build time.
        noCompress 'apk'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    // ComponentActivity supplies the LifecycleOwner that CameraX binds against.
    implementation "androidx.activity:activity-ktx:1.8.2"

    def camerax = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"

    // Offline speech recognition for the wake words.
    implementation "com.alphacephei:vosk-android:0.3.47"
}
