plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.picotts'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.example.picotts"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    externalNativeBuild {
        // ndkBuild rather than CMake: the NDK ships its own make, so no extra SDK component needed.
        ndkBuild { path 'src/main/cpp/Android.mk' }
    }

    androidResources {
        // Pico memory-maps these, so they must not be compressed inside the APK.
        noCompress 'bin'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }
}
